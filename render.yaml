# Render "Blueprint": tells Render how to run this app for free. Render reads this file from your GitHub repo.
services:
  - type: web
    name: tabletop-mtg
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /healthz
    # Optional: add an environment variable ROOM_PASSWORD in Render to get a master password that opens every room.
